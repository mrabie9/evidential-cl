# Snapshot for the post-noise-removal ablation grid (scripts/run_ablations_noise_removed.sh).
# M3: cmaml baseline + meta_batches 1 (single inner meta-batch).
model: lamaml_cifar
loader: task_incremental_loader
learn_lr: false
sync_update: true
use_old_task_memory: false
second_order: false
opt_wt: 0.01
alpha_init: 0.003
meta_batches: 1
