model: woe_si_replay
loader: task_incremental_loader
lr: 0.003
# The parameter anchor is off so the sweep isolates what the *evidence* term adds
# on top of ordinary experience replay. A 2x2 over the full task sequence found the
# anchor contributes nothing once replay is present, so leaving it on would only
# confound this measurement.
woe_lambda: 0.0
woe_reg_level: parameter
woe_centering_mode: centered_uniform
woe_mu_momentum: 0.9
woe_conflict_weighting: false

# Reservoir experience replay.
woe_replay_memories: 5120
woe_replay_batch_size: 128
woe_replay_lambda: 1.0

# "both" = rehearsal cross-entropy plus the one-sided evidence-decay penalty, so
# woe_evidence_lambda = 0 recovers plain ER exactly and sits inside the sweep as
# its own control arm.
woe_replay_mode: both
# The decay term is J^2-normalised and one-sided, so it is far smaller than the
# cross-entropy it competes with: measured on the 10-task TIL run it is
# 0.00019-0.00062 against a current-task CE of 0.60-1.01, i.e. CE/decay spans
# 1638-4508 with a geometric centre of ~2800. It is NOT on the same scale as
# woe_replay_lambda and does not transfer from any other woe_lambda grid.
woe_evidence_lambda: 3000.0
