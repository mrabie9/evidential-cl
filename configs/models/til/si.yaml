# Model-specific overrides for si.
model: si
loader: task_incremental_loader

lr: 0.003
si_c: 0.4

# How the quadratic anchor is applied: loss | proximal.
#   loss     -- add lambda * Omega * (theta - theta*)^2 to the training loss and
#               let the optimiser descend it (the original behaviour).
#   proximal -- keep it out of the backward pass and apply its closed-form
#               minimiser after the optimiser step (utils/proximal_anchor.py).
# The two modes do NOT share a useful penalty strength; sweep each separately
# (scripts/run_anchor_mode_benchmark.py).
anchor_mode: loss
