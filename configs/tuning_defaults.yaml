# Baseline configuration used when sweeping hyperparameters.
expt_name: tuning_sweep
arch: resnet1d
loader: task_incremental_loader
# Blank on purpose: configs/base.yaml's full-run task_order_files name files
# that do not exist in the small HPT tuning dataset.
task_order_files: ""

data_path: data/rff/radar/hpt
dataset: iq
data_scaling: normalize
classes_per_it: 6
iterations: 5000
workers: 0
class_order: random
increment: 5
test_batch_size: 128
samples_per_task: -1
val_rate: 10

cuda: true
seed: 99
amp: false
log_every: 50
log_dir: logs/tuning/individual
tf_dir: ""
calc_test_accuracy: false
state_logging: false

n_meta: 1
inner_steps: 1
temperature: 5
n_epochs: 5
optimizer: sgd
batch_size: 256
replay_batch_size: 128
# 0 disables gradient clipping; set a positive norm to re-enable it. There is
# no `clipgrad` key: no argparse argument declares it, so it would never reach
# a model, and every learner's own `clipgrad` default is already 0.
grad_clip_norm: 0

# La-MAML parameters
opt_lr: 0.1  # learning rate for LRs
opt_wt: 0.1  # learning rate for weights
alpha_init: 0.001  # initialization for the LRs

# Memory parameters
memories: 5120
n_memories: 5120  # total replay-buffer capacity across all tasks

# Parameters specific to MER were removed here. `gamma` and `beta` are not
# MER-specific as flag names -- GEM, GEM-R and HAT read `gamma`; UCL, BCL-Dual
# and BCL-Single read `beta`, each with its own meaning and default -- so values
# left here would reach all of them on every tuning run. There is no MER tuning
# preset; set MER's gamma/beta/s on the command line if MER is ever tuned.

# Parameters specific to Meta-BGD
bgd_optimizer: bgd  # Optimizer (choices: [adam, adagrad, bgd, sgd])
optimizer_params: "{}"  # Optimizer parameters
train_mc_iters: 2  # Number of MonteCarlo samples during training (default 10)
std_init: 0.02  # STD init value (default 5e-2)
mean_eta: 50.0  # Eta for mean step (default 1)
fisher_gamma: 0.95  # Fisher gamma

# Parameters specific to ANML
# rln: 7
# update_steps: 10
# meta_lr: 0.001
# update_lr: 0.1
